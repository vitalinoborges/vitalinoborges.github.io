<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {%- if page.title -%}{{ page.title }} · {{ site.title }}{%- else -%}{{ site.title }}{%- endif -%}
  </title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Google Fonts: Lora (serif) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- SEO -->
  {% seo %}

  <!-- Feed -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="site-wrapper">

    {% include header.html %}

    <main class="site-main" id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}

  </div>

  <!-- Botão scroll to top -->
  <button class="scroll-top" id="scrollTop" aria-label="Voltar ao topo">↑</button>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
