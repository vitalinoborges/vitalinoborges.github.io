title: "Index of /"
description: "Anotações do Vitalino Borges."
author: "Vitalino Borges"
url: ""
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins compatíveis com GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Paginação (opcional)
paginate: 10
paginate_path: "/page:num/"

# Categorias exibidas no index (ordem e rótulo)
featured_categories:
  - slug: eletronica
    label: "Eletrônica & Hardware"
  - slug: on-premises
    label: "On-premises"
  - slug: infraestrutura
    label: "Infraestrutura"
  - slug: sistemas-operacionais
    label: "Sistemas Operacionais"
  - slug: devops
    label: "DevOps"
  - slug: cybersecurity
    label: "Cybersecurity"
  - slug: programacao
    label: "Programação"
