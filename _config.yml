title: "Meu Blog Técnico"
description: "Artigos sobre tecnologia, programação e ciência."
author: "Seu Nome"
url: ""
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins compatíveis com GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Paginação (opcional)
paginate: 10
paginate_path: "/page:num/"

# Categorias exibidas no index (ordem e rótulo)
featured_categories:
  - slug: programacao
    label: "Programação"
  - slug: devops
    label: "DevOps"
  - slug: arquitetura
    label: "Arquitetura de Software"
  - slug: banco-de-dados
    label: "Banco de Dados"
